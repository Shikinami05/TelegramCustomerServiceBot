name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v1.3.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_type == 'tag' && github.ref || 'main' }}
      - id: release
        name: Prepare annotated release tag
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${REQUESTED_VERSION}"
          else
            release_tag="v$(tr -d '[:space:]' < VERSION)"
          fi

          declared_version="$(tr -d '[:space:]' < VERSION)"
          test "${release_tag}" = "v${declared_version}"
          [[ "${release_tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin \
            "refs/tags/${release_tag}" >/dev/null 2>&1; then
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              echo "Tag already exists: ${release_tag}" >&2
              exit 1
            fi
            echo "Tag already exists; no release is needed: ${release_tag}"
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${release_tag}" -m "Release ${release_tag}"
          git push origin "refs/tags/${release_tag}"
          echo "should_release=true" >> "${GITHUB_OUTPUT}"

  verify:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate release tag
        run: |
          git fetch --force origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          declared_version="$(tr -d '[:space:]' < VERSION)"
          test "${RELEASE_TAG}" = "v${declared_version}"
          [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = "tag"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: bash -n scripts/*.sh
      - run: bash tests/test_scripts.sh
      - run: python -m py_compile app.py tg_bot/*.py scripts/manage_webhook.py scripts/manage_backup.py scripts/manage_turnstile.py
      - run: python -m unittest discover -s tests -v

  publish:
    needs:
      - prepare
      - verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists."
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --generate-notes \
              --title "${RELEASE_TAG}"
          fi
